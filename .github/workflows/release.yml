name: Release

# Publishes one raw binary per platform, named build82_<goos>_<goarch> (".exe" on Windows), the
# build82.mcpb Claude Desktop bundle, a checksums.txt over all of them, a keyless Sigstore bundle
# signing checksums.txt, and the MCP Registry server.json. Asset names carry no version, so
# releases/latest/download/<name> always points at the newest release. Every asset is built by
# `go run ./scripts/release <tag>` in the build job, which holds no write permission; the
# sign-publish job, which runs no repository code, signs them, records GitHub build provenance
# attestations for the binaries and the bundle and creates the release; the publish-registry job
# then publishes the server.json of the same verified workflow artifact to the MCP Registry.

on:
  push:
    tags:
      - "v*"

# Read-only by default (least privilege) — each job below that needs more (the release itself,
# attestations, OIDC) declares it.
permissions:
  contents: read

jobs:
  # GITHUB_REF_NAME becomes part of a shell string (-ldflags), so its format is validated once, up
  # front, rather than trusting the "v*" trigger glob (which only checks the prefix). The tagged
  # commit must also be on main, so a tag pushed on any other branch never releases.
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate tag format
        run: |
          set -euo pipefail
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match vMAJOR.MINOR.PATCH"
            exit 1
          fi

      # Full history and every branch, so origin/main can be compared with the tagged commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tagged commit must be on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag '${GITHUB_REF_NAME}' points at ${GITHUB_SHA}, which is not on main"
            exit 1
          fi

  # Runs the CI check battery (the same reusable workflow ci.yml calls) against the tagged commit,
  # on the same three operating systems and with no Go cache, so a tag on a failing commit never
  # produces a release.
  checks:
    needs: validate
    uses: ./.github/workflows/checks.yml
    with:
      go-cache: false # never restore module/build caches saved by other workflow runs into a release

  # Builds every artifact in one job: the .mcpb bundle needs all the binaries (it merges the two
  # darwin ones into a universal binary), and cross-compiling with CGO_ENABLED=0 gives the same
  # output on any runner. It runs repository and dependency code and third-party validators
  # (mcp-publisher, @anthropic-ai/mcpb), so it holds no write permission and no OIDC token: nothing
  # it runs can sign, attest or publish anything.
  build:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: false # the released binaries are built from a clean cache only

      # Writes the binaries, build82.mcpb, checksums.txt (bare file names, the format self-update
      # parses) and server.json into dist/, checks that the binary reports the tag, and runs the
      # release contract test on the real dist/ — the same action as CI's release-contract job.
      - name: Package
        uses: ./.github/actions/package-release
        with:
          version: ${{ github.ref_name }}

      # Uploaded before any third-party tool (mcp-publisher, mcpb) runs, so the artifact that is
      # signed and published is exactly what scripts/release wrote.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7 # sign-publish and publish-registry can be re-run alone while the artifact exists

      # An invalid server.json or MCPB manifest fails the run before any release exists. The
      # validators run on copies outside dist/.
      - name: Validate the release metadata
        uses: ./.github/actions/validate-release

  # Signs, attests and publishes what the build job produced. It checks out no code and runs
  # nothing from the repository, so the write permissions and the OIDC token it holds are only used
  # by the pinned actions and commands below. It must stay in this file: the signing certificate
  # names the workflow file the job runs in, and self-update requires release.yml. The "release"
  # environment holds it for the protection rules set in the repository settings (required
  # reviewers, "v*" tags only).
  sign-publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # only this job publishes the release
      id-token: write # GitHub OIDC token for cosign's keyless signing and the build provenance attestation
      attestations: write # stores the build provenance attestation
    steps:
      # The action fails when a downloaded file doesn't match the digest recorded at upload.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # Every asset must be the one checksums.txt describes before anything is signed.
      - name: Verify the artifacts against checksums.txt
        working-directory: dist
        run: sha256sum --check --strict checksums.txt

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v3.1.4" # pinned so an installer update cannot change the signing flags

      # Signs checksums.txt, which covers every binary and the bundle, into a single Sigstore
      # bundle.
      - name: Sign checksums.txt (keyless, Sigstore bundle)
        working-directory: dist
        run: cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt

      # The same check "build82 self-update" runs when cosign is installed: the certificate must
      # name the release workflow of oito2/mcp-build82 (the repository self-update hard-codes, not
      # whichever repository runs this) for exactly this tag. A bundle it would refuse is never
      # published.
      - name: Verify the signature as self-update does
        working-directory: dist
        run: |
          cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/oito2/mcp-build82/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      # Records SLSA build provenance for each binary and the bundle. Verify a downloaded asset with
      # `gh attestation verify <file> --repo oito2/mcp-build82`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/build82_*
            dist/build82.mcpb

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  # Publishes the server.json of the workflow artifact the release was made from (digest-checked
  # by download-artifact), after checking that its fileSha256 is the checksum of the signed
  # build82.mcpb and its version is the tag's. A separate job, so a failed publish can be re-run
  # without re-creating the release.
  publish-registry:
    needs: sign-publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # GitHub OIDC login to the MCP Registry
    steps:
      # Only for the local install-mcp-publisher action.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: server.json must describe the signed bundle of this tag
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum --check --strict checksums.txt
          want="$(awk '$2 == "build82.mcpb" { print $1 }' checksums.txt)"
          got="$(jq -r '.packages[0].fileSha256' server.json)"
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "::error::server.json fileSha256 '$got' does not match build82.mcpb in checksums.txt ('$want')"
            exit 1
          fi
          version="$(jq -r '.version' server.json)"
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::server.json version '$version' is not the tag's (${GITHUB_REF_NAME#v})"
            exit 1
          fi

      - name: Install mcp-publisher
        uses: ./.github/actions/install-mcp-publisher

      - name: Authenticate to the MCP Registry
        working-directory: dist
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'

      - name: Publish to the MCP Registry
        working-directory: dist
        run: '"$RUNNER_TEMP/mcp-publisher" publish'
