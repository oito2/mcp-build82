name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  MCP_PUBLISHER_VERSION: v1.8.1

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true # always the newest 1.26.x patch, not an older one cached on the runner

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test -race (regex backend)
        run: go test -race ./...

      - name: go test -race (tree-sitter backend)
        env:
          BUILD82_EXTRACTOR_BACKEND: treesitter
        run: go test -race ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

      - name: Build release artifacts
        run: go run ./scripts/release "${{ github.ref_name }}"

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP" mcp-publisher

      - name: Validate server.json against the MCP Registry
        working-directory: dist
        run: '"$RUNNER_TEMP/mcp-publisher" validate'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*

  # Publishes the server.json attached to the release, so its fileSha256 is the checksum of the
  # build82.mcpb asset users download. Kept as a separate job so a failed publish can be re-run
  # without re-creating the release.
  publish-registry:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC login to the MCP Registry
    steps:
      - name: Download server.json from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern server.json

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP" mcp-publisher

      - name: Authenticate to the MCP Registry
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'

      - name: Publish to the MCP Registry
        run: '"$RUNNER_TEMP/mcp-publisher" publish'
