name: Release

# Publishes one raw binary per platform, named build82_<goos>_<goarch> (".exe" on Windows), the
# build82.mcpb Claude Desktop bundle, a checksums.txt over all of them, a keyless Sigstore bundle
# signing checksums.txt, and the MCP Registry server.json. Asset names carry no version, so
# releases/latest/download/<name> always points at the newest release. Every asset is built by
# `go run ./scripts/release <tag>` in the build job, which holds no write permission; the
# sign-publish job, which runs no repository code, signs them, records GitHub build provenance
# attestations for the binaries and the bundle and creates the release; the publish-registry job
# then publishes server.json to the MCP Registry.

on:
  push:
    tags:
      - "v*"

# Read-only by default (least privilege) — each job below that needs more (the release itself,
# attestations, OIDC) declares it.
permissions:
  contents: read

# Tool versions pinned here and in ci.yml. Dependabot doesn't update these; CONTRIBUTING's
# pinned-version table lists them.
env:
  # golangci-lint release the checks job runs.
  GOLANGCI_LINT_VERSION: v2.14.0
  # govulncheck release the checks job runs.
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  # GITHUB_REF_NAME becomes part of a shell string (-ldflags), so its format is validated once, up
  # front, rather than trusting the "v*" trigger glob (which only checks the prefix).
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate tag format
        run: |
          set -euo pipefail
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match vMAJOR.MINOR.PATCH"
            exit 1
          fi

  # Runs the same checks as CI against the tagged commit, on the same three operating systems, so
  # a tag on a failing commit never produces a release.
  checks:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # later steps never push, so the token isn't left in .git/config

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true # newest 1.26.x patch, not an older one cached on the runner
          cache: false # never restore module/build caches saved by other workflow runs into a release

      - name: Format check
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: golangci-lint (windows, darwin)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Built for the runner first: GOOS only applies to the lint run.
          GOBIN="$RUNNER_TEMP/lint" go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          for goos in windows darwin; do
            GOOS="$goos" "$RUNNER_TEMP/lint/golangci-lint" run ./...
          done

      - name: Build
        run: go build ./...

      - name: Test (regex backend)
        run: go test -race ./...

      - name: Test (tree-sitter backend)
        env:
          BUILD82_EXTRACTOR_BACKEND: treesitter
        run: go test -race ./...

      - name: govulncheck
        if: runner.os == 'Linux'
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  # Builds every artifact in one job: the .mcpb bundle needs all the binaries (it merges the two
  # darwin ones into a universal binary), and cross-compiling with CGO_ENABLED=0 gives the same
  # output on any runner. It runs repository and dependency code and a third-party binary
  # (mcp-publisher), so it holds no write permission and no OIDC token: nothing it runs can sign,
  # attest or publish anything.
  build:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: false # the released binaries are built from a clean cache only

      # Writes the binaries, build82.mcpb, checksums.txt (bare file names, the format self-update
      # parses) and server.json into dist/, then checks that the binary reports the tag.
      - name: Build release artifacts
        run: |
          set -euo pipefail
          go run ./scripts/release "${GITHUB_REF_NAME}"
          test "$(./dist/build82_linux_amd64 --version)" = "${GITHUB_REF_NAME}"

      # The same check as CI's release-contract job, on the real dist/: self-update can find every
      # asset and its checksum.
      - name: Check the release contract
        run: BUILD82_DIST_DIR="$PWD/dist" go test -run TestReleaseContract -v ./internal/selfupdate

      - name: Install mcp-publisher
        uses: ./.github/actions/install-mcp-publisher

      # An invalid server.json fails the run before any release exists.
      - name: Validate server.json against the MCP Registry schema
        working-directory: dist
        run: '"$RUNNER_TEMP/mcp-publisher" validate'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7 # sign-publish can be re-run alone while the artifact exists

  # Signs, attests and publishes what the build job produced. It checks out no code and runs
  # nothing from the repository, so the write permissions and the OIDC token it holds are only used
  # by the pinned actions and commands below.
  sign-publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # only this job publishes the release
      id-token: write # GitHub OIDC token for cosign's keyless signing and the build provenance attestation
      attestations: write # stores the build provenance attestation
    steps:
      # The action fails when a downloaded file doesn't match the digest recorded at upload.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # Every asset must be the one checksums.txt describes before anything is signed.
      - name: Verify the artifacts against checksums.txt
        working-directory: dist
        run: sha256sum --check --strict checksums.txt

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6" # pinned so an installer update cannot change the signing flags

      # Signs checksums.txt, which covers every binary and the bundle, into a single Sigstore
      # bundle.
      - name: Sign checksums.txt (keyless, Sigstore bundle)
        working-directory: dist
        run: cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt

      # The same check "build82 self-update" runs when cosign is installed: the certificate must
      # name this repository's release workflow for exactly this tag. A bundle it would refuse is
      # never published.
      - name: Verify the signature as self-update does
        working-directory: dist
        run: |
          cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      # Records SLSA build provenance for each binary and the bundle. Verify a downloaded asset with
      # `gh attestation verify <file> --repo oito2/mcp-build82`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/build82_*
            dist/build82.mcpb

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  # Publishes the server.json attached to the release, so its fileSha256 is the checksum of the
  # build82.mcpb asset users download. A separate job, so a failed publish can be re-run without
  # re-creating the release.
  publish-registry:
    needs: sign-publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # GitHub OIDC login to the MCP Registry
    steps:
      # Only for the local install-mcp-publisher action.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download server.json from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern server.json

      - name: Install mcp-publisher
        uses: ./.github/actions/install-mcp-publisher

      - name: Authenticate to the MCP Registry
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'

      - name: Publish to the MCP Registry
        run: '"$RUNNER_TEMP/mcp-publisher" publish'
