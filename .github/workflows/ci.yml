name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default (least privilege) — this workflow only builds, vets and tests; it never
# publishes anything.
permissions:
  contents: read

jobs:
  # The check battery shared with release.yml (tool versions and the coverage floor live there).
  checks:
    uses: ./.github/workflows/checks.yml

  # Runs scripts/release, the program releases are built with, under a pre-release tag, then
  # checks that self-update can find, verify and run its binaries, that server.json describes the
  # bundle and passes the MCP Registry validation, and that the bundle's manifest passes the MCPB
  # validation — the same actions release.yml's build job uses.
  release-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # later steps never push, so the token isn't left in .git/config

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true # newest 1.26.x patch, not an older one cached on the runner

      - name: Package
        uses: ./.github/actions/package-release
        with:
          version: v0.0.0-ci
          allow-prerelease: "true"

      - name: Validate the release metadata
        uses: ./.github/actions/validate-release
