name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default (least privilege) — this workflow only builds, vets and tests; it never
# publishes anything.
permissions:
  contents: read

# Tool versions, pinned so a new release cannot fail CI on unchanged code. Dependabot doesn't
# update these; CONTRIBUTING's pinned-version table lists them, and release.yml pins the same ones.
env:
  # golangci-lint release the lint steps run.
  GOLANGCI_LINT_VERSION: v2.14.0
  # govulncheck release the vulnerability check runs.
  GOVULNCHECK_VERSION: v1.8.0
  # actionlint release the workflow check runs.
  ACTIONLINT_VERSION: v1.7.12
  # Total statement coverage (go test -coverpkg=./...) may not drop below this percentage.
  COVERAGE_FLOOR: "86.0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # later steps never push, so the token isn't left in .git/config

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true # newest 1.26.x patch, not an older one cached on the runner

      - name: Format check
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Vet (windows, darwin)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          for goos in windows darwin; do
            GOOS="$goos" go vet ./...
          done

      - name: golangci-lint
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      # The Windows- and macOS-only files (rename_windows.go, open_other.go…) are linted too,
      # cross-checked from Linux with the same pinned version.
      - name: golangci-lint (windows, darwin)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Built for the runner first: GOOS only applies to the lint run.
          GOBIN="$RUNNER_TEMP/lint" go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          for goos in windows darwin; do
            GOOS="$goos" "$RUNNER_TEMP/lint/golangci-lint" run ./...
          done

      - name: Build
        run: go build ./...

      - name: Test (regex backend)
        run: go test -race ./...

      - name: Test (tree-sitter backend)
        env:
          BUILD82_EXTRACTOR_BACKEND: treesitter
        run: go test -race ./...

  # Linux-only checks of the repository as a whole.
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true

      - name: go mod tidy
        run: go mod tidy -diff

      - name: actionlint
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

      - name: Documentation links
        run: go run ./scripts/linkcheck

      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

      # Fails when the total statement coverage drops below COVERAGE_FLOOR.
      - name: Coverage floor
        run: |
          set -euo pipefail
          go test -race -coverprofile="$RUNNER_TEMP/cover.out" -coverpkg=./... ./...
          total="$(go tool cover -func="$RUNNER_TEMP/cover.out" | awk '/^total:/ { sub("%", "", $3); print $3 }')"
          awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN {
            if (t + 0 < f + 0) { printf "::error::coverage %.1f%% is below the %.1f%% floor\n", t, f; exit 1 }
            printf "coverage %.1f%% (floor %.1f%%)\n", t, f
          }'

      # TMPDIR behind a symbolic link reproduces macOS's /var -> /private/var, so path comparisons
      # that miss a symlink resolution fail here too.
      - name: Test with TMPDIR behind a symlink
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/real-tmp"
          ln -s "$RUNNER_TEMP/real-tmp" "$RUNNER_TEMP/link-tmp"
          TMPDIR="$RUNNER_TEMP/link-tmp" go test ./...

  # Runs scripts/release, the program releases are built with, under a pre-release tag, then
  # checks that self-update can find, verify and run its binaries and that server.json passes the
  # MCP Registry validation.
  release-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true

      - name: Package
        run: |
          set -euo pipefail
          go run ./scripts/release -allow-prerelease v0.0.0-ci
          test "$(./dist/build82_linux_amd64 --version)" = "v0.0.0-ci"

      - name: Check the release contract
        run: BUILD82_DIST_DIR="$PWD/dist" go test -run TestReleaseContract -v ./internal/selfupdate

      - name: Install mcp-publisher
        uses: ./.github/actions/install-mcp-publisher

      - name: Validate server.json against the MCP Registry schema
        working-directory: dist
        run: '"$RUNNER_TEMP/mcp-publisher" validate'
