version: 2
updates:
  # Bumps the SHA-pinned GitHub Actions (and their "# vX" comments).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Waits 14 days after a release before proposing it; security updates are not delayed.
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
  # Bumps the Go module dependencies in go.mod.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Waits 14 days after a release before proposing it; security updates are not delayed.
    cooldown:
      default-days: 14
    commit-message:
      prefix: deps
